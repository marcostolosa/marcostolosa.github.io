name: Test & deploy

on:
  push:
  pull_request:
  schedule:
    # Daily rebuild: the dollar price on the English /pentest/ page is converted from reais at build time
    # (src/data/fx.ts), so a rebuild keeps it close to the market rate.
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: Resubmit every URL in the sitemap to IndexNow, not only what changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Accessibility & functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Test build includes tests/fixtures/writeups so the article template is covered.
      - run: npm run build:test
      - run: npx playwright install --with-deps chromium firefox webkit
      # WCAG 2.2 AA (axe-core) on every page and every home section, EN and PT-BR,
      # desktop and mobile; plus Step/Run, keyboard focus, language switch, links, overflow.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Production build
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> for the home, writeups index and tool pages is the date of the
          # last commit that touched their source.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The sitemap that is about to go live, handed to the IndexNow job. The runner cannot fetch the public site:
      # Cloudflare answers GitHub's datacenter addresses with 403.
      - uses: actions/upload-artifact@v4
        with:
          name: new-sitemap
          path: dist/sitemap.xml
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    # A failed ping must not turn a good deploy red: the pages are already live.
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Public by design: IndexNow checks it against https://mindsecurity.org/<key>.txt (public/<key>.txt).
      INDEXNOW_KEY: 26311cdcef15d68de328fb2872e6d8e9
      SITE_HOST: mindsecurity.org
      INDEXNOW_ALL: ${{ inputs.indexnow_all || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            public
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: new-sitemap
      # The sitemap submitted last time. The cache is the memory between runs; the newest entry wins.
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-prev
          key: indexnow-sitemap-${{ github.run_id }}
          restore-keys: indexnow-sitemap-
      - name: Submit what changed
        run: |
          mkdir -p indexnow-prev
          [ -f indexnow-prev/sitemap.xml ] || echo '<urlset/>' > indexnow-prev/sitemap.xml
          node scripts/indexnow.mjs indexnow-prev/sitemap.xml sitemap.xml
      - name: Remember it
        run: cp sitemap.xml indexnow-prev/sitemap.xml
      - uses: actions/cache/save@v4
        with:
          path: indexnow-prev
          key: indexnow-sitemap-${{ github.run_id }}
